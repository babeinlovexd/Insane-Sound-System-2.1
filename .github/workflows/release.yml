name: Build and release
'on':
  push:
    branches:
    - '**'
    tags:
    - v*
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Check version and package source
      run: python ci/release.py --package
    - uses: actions/upload-artifact@v7
      with:
        name: source
        path: release-output/*
        if-no-files-found: error
  esphome:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m pip install esphome==2026.10.2
    - name: Compile with CI placeholders
      run: python ci/esphome_check.py "ESPHome/insane-sound-system-2.1.yaml"
  build-flasher-exe:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: Python einrichten
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter requests esptool Pillow zeroconf pyinstaller
    - name: InsaneFlasher.exe bauen
      shell: pwsh
      run: |
        cd InsaneFlasher/Linux_Mac

        pyinstaller -y `
          --noconsole `
          --onefile `
          --name=InsaneFlasher `
          --icon=logo.ico `
          --add-data="logo.png;." `
          --add-data="logo.ico;." `
          --hidden-import=serial.urlhandler.protocol_socket `
          --collect-data=esptool `
          InsaneFlasher.py
    - uses: actions/upload-artifact@v7
      with:
        name: build-flasher-exe
        path: InsaneFlasher/Linux_Mac/dist/InsaneFlasher.exe
        if-no-files-found: error
    timeout-minutes: 45
  release-firmware:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Python für PlatformIO einrichten
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: PlatformIO installieren
      run: pip install platformio
    - name: WROOM32D Firmware kompilieren
      run: pio run -d Firmware/WROOM32D -e esp32dev
    - name: RP2354A Firmware kompilieren
      run: pio run -d Firmware/RP2354A -e rp2354
    - name: Dateien für Release vorbereiten
      shell: bash
      run: |
        cp Firmware/WROOM32D/.pio/build/esp32dev/firmware.bin wroom.bin
        cp Firmware/RP2354A/.pio/build/rp2354/firmware.bin rp2354.bin
    - uses: actions/upload-artifact@v7
      with:
        name: release-firmware
        path: |
          wroom.bin
          rp2354.bin
        if-no-files-found: error
    timeout-minutes: 45
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
    - source
    - esphome
    - build-flasher-exe
    - release-firmware
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        path: release-output
        merge-multiple: true
    - name: Hash complete downloads
      working-directory: release-output
      run: |-
        find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
        sha256sum -c SHA256SUMS.txt
    - name: Publish complete release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: gh release create "$TAG" release-output/* --verify-tag --title "${GITHUB_REPOSITORY#*/} $TAG" --notes-file RELEASE-NOTES.md
